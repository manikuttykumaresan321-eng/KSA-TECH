spring.application.name=scheme-recommendation-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scheme_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:schemeuser}
spring.datasource.password=${DB_PASSWORD:schemepass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
