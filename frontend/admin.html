<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | SchemeWise AI</title><link rel="stylesheet" href="style.css"><style>
.admin-wrap{width:min(900px,90%);margin:50px auto}.admin-wrap h1{font-size:35px}.admin-panel{background:#fff;border:1px solid #e8eaf2;border-radius:16px;padding:24px;margin:20px 0}.admin-form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.admin-form label{font-size:12px;font-weight:700}.admin-form input,.admin-form select,.admin-form textarea{display:block;width:100%;margin-top:7px;border:1px solid #e4e6ef;border-radius:8px;padding:11px;font:inherit;font-size:12px}.admin-form .wide{grid-column:1/-1}.admin-form textarea{min-height:80px}.status{font-size:12px;color:#6d7890;line-height:1.6}.scheme-row{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px;font-size:12px}.danger{border:0;border-radius:8px;padding:8px 10px;background:#fff0f0;color:#b93838;font-size:11px}@media(max-width:600px){.admin-form{grid-template-columns:1fr}.admin-form .wide{grid-column:auto}}
</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>SchemeWise <b>AI</b><small>ADMIN CONSOLE</small></span></a><a class="small-link" href="index.html">← Home</a></header>
<main class="admin-wrap"><div class="eyebrow">MANAGE THE CATALOGUE</div><h1>Scheme administration</h1><p class="status">Admin access is required. Create and maintain scheme records through the protected backend API.</p>
<section class="admin-panel"><h2 style="font-size:21px">Add a scheme</h2><form id="schemeForm" class="admin-form">
<label>Scheme name<input id="name" required></label><label>Category<select id="category"><option>Education</option><option>Agriculture</option><option>Business</option><option>Women & Child</option><option>Housing</option><option>Healthcare</option><option>Employment</option><option>Other</option></select></label>
<label>Minimum age<input id="minAge" type="number" min="0" value="18" required></label><label>Maximum age<input id="maxAge" type="number" min="1" value="100" required></label>
<label>Maximum annual income (₹)<input id="maxIncome" type="number" min="0" value="500000" required></label><label>Target occupation<input id="occupation" placeholder="student, farmer, other"></label>
<label class="wide">Short description<textarea id="description" required></textarea></label><label class="wide">Official URL<input id="officialUrl" type="url" placeholder="https://..." required></label>
<button class="button button-primary wide" type="submit">Add scheme →</button></form><p id="status" class="status" role="status"></p></section>
<section class="admin-panel"><h2 style="font-size:21px">Current schemes</h2><div id="schemeList" class="status">Loading schemes…</div></section></main>
<script src="api.js"></script><script>
const $=id=>document.getElementById(id);async function load(){try{const list=await SchemeAPI.schemes();$("schemeList").innerHTML=list.map(s=>`<div class="scheme-row"><span><strong>${escapeHtml(s.name)}</strong><br>${escapeHtml(s.category||"Other")}</span><button class="danger" data-delete="${s.id}">Delete</button></div>`).join("")||"No schemes yet.";}catch(e){$("schemeList").textContent=e.message+" — sign in with an admin account and start the backend."}}
function escapeHtml(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
$("schemeForm").onsubmit=async e=>{e.preventDefault();try{await SchemeAPI.adminCreateScheme({name:$("name").value,category:$("category").value,minAge:+$("minAge").value,maxAge:+$("maxAge").value,maxAnnualIncome:+$("maxIncome").value,occupation:$("occupation").value,description:$("description").value,officialUrl:$("officialUrl").value});$("status").textContent="Scheme added.";e.target.reset();load();}catch(err){$("status").textContent=err.message;}};
$("schemeList").addEventListener("click",async e=>{const b=e.target.closest("[data-delete]");if(!b)return;if(!confirm("Delete this scheme?"))return;try{await SchemeAPI.adminDeleteScheme(+b.dataset.delete);load();}catch(err){$("status").textContent=err.message;}});
load();
</script></body></html>
